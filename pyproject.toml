[tool.isort]
multi_line_output = 3
include_trailing_comma = true  # обязательная запятая в конце
force_grid_wrap = 2
use_parentheses = true
line_length = 79
ensure_newline_before_comments = true
known_first_party = "fast_api_finance"

[tool.black]
line-length = 79
target-version = ['py38', 'py39', 'py310', 'py311']
skip-string-normalization = true
force-single-line = false

[tool.flake8]
max-line-length = 79
exclude = ".git,.venv,.tox,build,dist,*migrations*"
lint.ignore = "E203,W503"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
ignore_missing_imports = true
disallow_untyped_defs = true
follow_imports = "silent"

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = []
line-length = 79
target-version = "py38"

[tool.ruff.lint.pydocstyle]
convention = "google"
